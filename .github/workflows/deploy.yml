name: Build and deploy Hearth v2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hearth-v2
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  IMAGE_REPOSITORY: hearth-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Run release build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable image
        id: image
        run: |
          set -euo pipefail
          login_server="${ACR_NAME}.azurecr.io"
          candidate_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_version="$(jq -r '"\(.major).\(.minor).\(.patch)+build.\(.build)"' version.json)"
          build_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          az acr login --name "$ACR_NAME"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${login_server}/${IMAGE_REPOSITORY}:${candidate_tag}" \
            --build-arg "BUILD_VERSION=${build_version}" \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=${build_time}" \
            --build-arg "BUILD_ID=${build_id}" \
            .

          digest="$(az acr manifest show-metadata \
            --registry "$ACR_NAME" \
            --name "${IMAGE_REPOSITORY}:${candidate_tag}" \
            --query digest -o tsv)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${login_server}/${IMAGE_REPOSITORY}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Pin exact digest and verify
        id: deploy
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          prior_image="$(az webapp config container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query '[?name==`DOCKER_CUSTOM_IMAGE_NAME`].value | [0]' -o tsv)"
          echo "prior_image=$prior_image" >> "$GITHUB_OUTPUT"

          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "${{ steps.image.outputs.image }}" \
            --container-registry-url "https://${ACR_NAME}.azurecr.io"
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

          origin="https://${WEBAPP_NAME}.azurewebsites.net"
          for attempt in $(seq 1 90); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            live="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "${origin}/api/live?nonce=${nonce}" 2>/dev/null || true)"
            ready="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "${origin}/api/ready?nonce=${nonce}" 2>/dev/null || true)"
            if jq -e --arg sha "$GITHUB_SHA" '.status == "live" and .source_sha == $sha' <<<"$live" >/dev/null 2>&1 &&
               jq -e --arg sha "$GITHUB_SHA" '.status == "ready" and .source_sha == $sha and .checks.database.ok == true' <<<"$ready" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Restore prior image after failed activation
        if: ${{ failure() && steps.deploy.outputs.prior_image != '' }}
        run: |
          set -euo pipefail
          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "${{ steps.deploy.outputs.prior_image }}" \
            --container-registry-url "https://${ACR_NAME}.azurecr.io"
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

      - name: Promote verified digest
        if: ${{ success() }}
        run: |
          set -euo pipefail
          registry="${ACR_NAME}.azurecr.io"
          digest="${{ steps.image.outputs.digest }}"
          refresh_token="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          token="$(curl -fsS \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=refresh_token' \
            --data-urlencode "service=$registry" \
            --data-urlencode "scope=repository:${IMAGE_REPOSITORY}:pull,push" \
            --data-urlencode "refresh_token=$refresh_token" \
            "https://${registry}/oauth2/token" | jq -er .access_token)"
          manifest="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$manifest" "$headers"' EXIT

          curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            -D "$headers" \
            -o "$manifest" \
            "https://${registry}/v2/${IMAGE_REPOSITORY}/manifests/${digest}"
          content_type="$(awk 'tolower($1) == "content-type:" { gsub(/\r/, "", $2); print $2 }' "$headers" | tail -1)"
          [[ -n "$content_type" ]]
          curl -fsS \
            -X PUT \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: $content_type" \
            --data-binary "@${manifest}" \
            "https://${registry}/v2/${IMAGE_REPOSITORY}/manifests/latest" \
            -o /dev/null

          promoted_digest="$(az acr manifest show-metadata \
            --registry "$ACR_NAME" \
            --name "${IMAGE_REPOSITORY}:latest" \
            --query digest -o tsv)"
          [[ "$promoted_digest" == "$digest" ]]
